  - id: S01
    perfil: semantica
    pergunta: "Como a plataforma garante que uma interrupção brusca durante o cadastramento de um texto não deixe o arquivo salvo pela metade?"
    responder: true
    documentos_relevantes:
      - 03_banco_vetorial_indexacao.md
      - 07_backup_recuperacao.md
    trechos_relevantes:
      - fonte: 03_banco_vetorial_indexacao.md
        trecho: "Se a geração dos vetores falhar no meio do processamento de um arquivo, a transação inteira sofre reversão automática e a versão anterior do documento permanece íntegra para os usuários."
        essencial: true
      - fonte: 07_backup_recuperacao.md
        trecho: "Para garantir a integridade dos dados durante reingestões cotidianas antes mesmo do backup externo, cada documento é atualizado em uma transação atômica única no banco de dados."
        essencial: true
      - fonte: 07_backup_recuperacao.md
        trecho: "Dessa forma, se ocorrer interrupção elétrica ou falha no provedor de embeddings durante a indexação, nenhuma metade de arquivo fica gravada e a versão anterior permanece disponível sem corrupção."
        essencial: false
    fatos_esperados:
      - "Substituição em transação atômica única por documento no banco de dados"
      - "Reversão automática (rollback) preservando a versão anterior íntegra"
    observacao_experimental: "Paráfrase sem usar 'transação', 'atômica', 'reversão' ou 'embeddings'; exercita consenso entre os trechos quase redundantes de 03 e 07."
    anotador: Diego
    revisor: Gabriel Alves
    status_revisao: pendente_validacao_humana

